<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Portal - Quiz History</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .history-layout {
            width: 100%;
            max-width: 960px;
            margin: auto;
            position: relative;
            z-index: 2;
        }

        .history-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .history-table-container {
            width: 100%;
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            margin-bottom: 1.5rem;
        }

        #historyTable {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        #historyTable th {
            background: var(--bg-secondary);
            padding: 14px 18px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        #historyTable td {
            padding: 16px 18px;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
        }

        #historyTable tbody tr:hover,
        #historyTable tr:hover {
            background: #F9FBFE;
        }

        #historyTable tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container" style="align-items: flex-start; padding-top: 2.5rem;">
        <div class="history-layout">
            <div class="history-box tilt-card" style="text-align: left; padding: 2.5rem;">

                <!-- HEADER -->
                <div class="history-header-bar">
                    <div style="display:flex; align-items:center; gap:14px;">
                        <div class="brand-logo" style="width:44px; height:44px; font-size:1.15rem; border-radius:12px;">OQ</div>
                        <div>
                            <span class="badge-pill blue" style="margin-bottom: 4px;">Historical Records</span>
                            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main);">Assessment History</h1>
                        </div>
                    </div>

                    <button id="backBtn" class="secondary-btn" type="button" style="padding: 10px 18px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        <span>Back To Dashboard</span>
                    </button>
                </div>

                <!-- TABLE WRAPPER -->
                <div class="history-table-container table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Attempt ID</th>
                                <th>Score (Points)</th>
                                <th>Total Questions</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable">
                            <!-- Loaded dynamically via history.js -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- TECH EFFECTS ENGINE -->
    <script src="js/tech-effects.js"></script>

    <!-- EXISTING HISTORY JAVASCRIPT -->
    <script src="js/api-config.js"></script>
    <script src="js/history.js"></script>

    <!-- EMPTY STATE CHECK -->
    <script>
        setTimeout(function() {
            const tbody = document.getElementById("historyTable");
            if (tbody && tbody.children.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align:center; padding:2.5rem 1rem; color:var(--text-secondary);">
                            <div style="font-size:1.05rem; font-weight:700; color:var(--text-main); margin-bottom:4px;">No Quiz Attempts Yet</div>
                            <div>Start a test from your dashboard to record your performance history.</div>
                        </td>
                    </tr>
                `;
            }
        }, 1200);
    </script>

</body>
</html>
