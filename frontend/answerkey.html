<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Portal - Answer Key</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .answerkey-layout {
            width: 100%;
            max-width: 860px;
            margin: auto;
            position: relative;
            z-index: 2;
        }

        .answerkey-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        /* ANSWER KEY ITEMS ENHANCED STYLING (Overrides inline JS styling cleanly) */
        #answerKeyContainer {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 2rem;
        }

        #answerKeyContainer > div {
            background: #FFFFFF !important;
            border: 1px solid var(--border) !important;
            border-radius: var(--radius-lg) !important;
            padding: 1.5rem 1.75rem !important;
            margin-bottom: 0 !important;
            box-shadow: var(--shadow-card) !important;
            transition: all var(--transition-fast) !important;
            position: relative;
        }

        #answerKeyContainer > div:hover {
            border-color: var(--primary) !important;
            box-shadow: var(--shadow-hover) !important;
            transform: translateY(-2px) !important;
        }

        #answerKeyContainer h3 {
            font-size: 1.05rem !important;
            font-weight: 800 !important;
            color: var(--primary-dark) !important;
            margin-bottom: 0.5rem !important;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #answerKeyContainer p {
            font-size: 0.95rem !important;
            color: var(--text-main) !important;
            line-height: 1.55 !important;
            margin-bottom: 0.45rem !important;
        }

        #answerKeyContainer p:first-of-type b {
            font-size: 1.05rem;
            color: var(--text-main);
            display: block;
            margin-bottom: 6px;
        }

        #answerKeyContainer p:last-child {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.85rem !important;
            margin-top: 6px;
            margin-bottom: 0 !important;
            background: var(--bg-secondary);
        }
    </style>
</head>
<body>

    <div class="container" style="align-items: flex-start; padding-top: 2.5rem;">
        <div class="answerkey-layout">
            <div class="history-box" style="text-align: left; padding: 2.5rem;">

                <!-- HEADER -->
                <div class="answerkey-header-bar">
                    <div style="display:flex; align-items:center; gap:14px;">
                        <div class="brand-logo" style="width:44px; height:44px; font-size:1.15rem; border-radius:12px;">OQ</div>
                        <div>
                            <span class="badge-pill purple" style="margin-bottom: 4px;">Comprehensive Review</span>
                            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main);">Quiz Answer Key</h1>
                        </div>
                    </div>

                    <button id="backBtn" class="secondary-btn" type="button" style="padding: 10px 18px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        <span>Back To Result</span>
                    </button>
                </div>

                <!-- ANSWER CONTAINER (ID preserved) -->
                <div id="answerKeyContainer"></div>

            </div>
        </div>
    </div>

    <!-- TECH EFFECTS ENGINE -->
    <script src="js/tech-effects.js"></script>

    <!-- EXISTING ANSWER KEY JAVASCRIPT -->
    <script src="js/answerkey.js"></script>

    <!-- EMPTY STATE CHECK -->
    <script>
        (function() {
            const container = document.getElementById("answerKeyContainer");
            if (container && container.children.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:2.5rem 1rem; color:var(--text-secondary); background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--radius-lg);">
                        <p style="font-size:1.05rem; font-weight:700; color:var(--text-main); margin-bottom:6px;">No Quiz Answers Recorded</p>
                        <p style="font-size:0.9rem;">Complete an assessment from your dashboard first to review question-by-question explanations.</p>
                        <a href="dashboard.html" class="primary-btn" style="margin-top:16px; display:inline-flex; width:auto; padding:10px 22px; font-size:0.88rem;">Go to Dashboard</a>
                    </div>
                `;
            }
        })();
    </script>

</body>
</html>
