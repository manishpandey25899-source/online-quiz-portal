<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Online Quiz Portal - Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <div class="container">


        <div class="register-box">


            <!-- OQ BRAND -->

            <div
                class="brand"
                style="
                    justify-content:center;
                    width:100%;
                    margin-bottom:28px;
                "
            >

                <div class="brand-logo">
                    OQ
                </div>

            </div>


            <!-- PORTAL TITLE -->

            <h1
                style="
                    text-align:center;
                    font-size:32px;
                    font-weight:800;
                    color:#24324a;
                    margin-bottom:8px;
                "
            >
                Online Quiz Portal
            </h1>


            <!-- REGISTER SUBTITLE -->

            <p
                style="
                    text-align:center;
                    font-size:16px;
                    font-weight:600;
                    color:#667085;
                    margin-bottom:30px;
                "
            >
                Create Your Account
            </p>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- FULL NAME -->

                <div class="input-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Create Account
                </button>


            </form>


            <!-- LOGIN LINK -->

            <div class="register-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>


        </div>


    </div>


    <!-- REGISTER JAVASCRIPT -->

    <script src="js/register.js"></script>


</body>

</html>
