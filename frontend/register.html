<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Portal - Register</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            margin: auto;
        }

        .auth-card-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(101, 214, 176, 0.12), rgba(57, 120, 246, 0.08), transparent 70%);
            filter: blur(40px);
            z-index: -1;
            pointer-events: none;
        }

        .auth-header {
            margin-bottom: 1.85rem;
            text-align: center;
        }

        .auth-header .brand-logo {
            margin: 0 auto 1.25rem;
            width: 58px;
            height: 58px;
            font-size: 1.5rem;
            border-radius: 18px;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.03em;
            margin-bottom: 0.35rem;
        }

        .auth-header p {
            font-size: 0.92rem;
            color: var(--text-secondary);
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-wrapper input {
            padding-left: 44px;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="auth-wrapper">
            <div class="auth-card-glow"></div>
            <div class="register-box tilt-card">

                <!-- OQ BRAND -->
                <div class="auth-header">
                    <div class="brand-logo">
                        OQ
                    </div>
                    <span class="badge-pill mint" style="margin-bottom: 12px;">Student Onboarding</span>
                    <h1>Online Quiz Portal</h1>
                    <p>Create your account to start testing your skills</p>
                </div>

                <!-- REGISTER FORM -->
                <form id="registerForm">

                    <!-- FULL NAME -->
                    <div class="input-group">
                        <label for="fullName">Full Name</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </div>
                            <input
                                type="text"
                                id="fullName"
                                placeholder="e.g. Alex Morgan"
                                required
                                autocomplete="name"
                            >
                        </div>
                    </div>

                    <!-- EMAIL -->
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </div>
                            <input
                                type="email"
                                id="email"
                                placeholder="name@institution.edu"
                                required
                                autocomplete="email"
                            >
                        </div>
                    </div>

                    <!-- PASSWORD -->
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </div>
                            <input
                                type="password"
                                id="password"
                                placeholder="Create a secure password"
                                required
                                autocomplete="new-password"
                            >
                        </div>
                    </div>

                    <!-- CONFIRM PASSWORD -->
                    <div class="input-group" style="margin-bottom: 1.75rem;">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                </svg>
                            </div>
                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Re-enter your password"
                                required
                                autocomplete="new-password"
                            >
                        </div>
                    </div>

                    <!-- REGISTER BUTTON -->
                    <button
                        type="submit"
                        class="login-btn"
                    >
                        <span>Create Account</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>

                </form>

                <!-- LOGIN LINK -->
                <div class="register-link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </div>

            </div>
        </div>
    </div>

    <!-- TECH EFFECTS ENGINE -->
    <script src="js/tech-effects.js"></script>

    <!-- REGISTER JAVASCRIPT -->
    <script src="js/api-config.js"></script>
    <script src="js/register.js"></script>

</body>
</html>
