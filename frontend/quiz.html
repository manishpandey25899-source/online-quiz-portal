<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Portal - Live Assessment</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .quiz-focus-wrapper {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .quiz-card {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            box-shadow: var(--shadow-card);
            position: relative;
        }

        /* TOP BAR */
        .quiz-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .quiz-brand-inline {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quiz-timer-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--danger-soft);
            border: 1px solid #FFD1D1;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            color: var(--danger-dark);
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(228, 88, 88, 0.1);
        }

        /* PROGRESS */
        .progress-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #EAF0F8;
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-bottom: 1.75rem;
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--mint) 100%);
            border-radius: var(--radius-full);
            transition: width 0.35s ease;
        }

        /* QUESTION BOX */
        .question-card-inner {
            background: #F8FAFD;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.75rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        #questionNumber {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        #questionText {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.6;
        }

        /* OPTIONS */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-choice-label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 1.1rem 1.25rem;
            background: #FFFFFF;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            color: var(--text-main);
            position: relative;
        }

        .option-choice-label:hover {
            border-color: var(--primary);
            background: #FBFDFF;
            transform: translateX(4px);
        }

        .option-choice-label input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .option-choice-label span {
            font-size: 0.98rem;
            font-weight: 600;
            line-height: 1.45;
            flex: 1;
        }

        .option-choice-label:has(input[type="radio"]:checked) {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(57, 120, 246, 0.06) 0%, rgba(107, 99, 232, 0.04) 100%);
            box-shadow: 0 4px 14px rgba(57, 120, 246, 0.12);
        }

        .option-choice-label:has(input[type="radio"]:checked) span {
            color: var(--primary-dark);
            font-weight: 700;
        }

        /* NAVIGATION BUTTONS */
        .quiz-actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.35fr;
            gap: 14px;
            margin-top: 2rem;
        }

        .quiz-actions-grid button {
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all var(--transition-fast);
        }

        #prevBtn {
            background: #FFFFFF;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        #prevBtn:hover {
            background: var(--bg-secondary);
            border-color: var(--border-hover);
        }

        #nextBtn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #FFFFFF;
            border: none;
            box-shadow: var(--shadow-glow);
        }

        #nextBtn:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }

        #submitBtn {
            background: linear-gradient(135deg, var(--mint-dark) 0%, #178e69 100%);
            color: #FFFFFF;
            border: none;
            box-shadow: 0 6px 18px rgba(31, 167, 116, 0.25);
        }

        #submitBtn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        @media (max-width: 650px) {
            .quiz-card {
                padding: 1.5rem 1.25rem;
            }

            .quiz-actions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="quiz-focus-wrapper">
            <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:100%; height:100%; background:radial-gradient(circle at 50% 50%, rgba(57, 120, 246, 0.10), rgba(101, 214, 176, 0.08), transparent 70%); filter:blur(40px); z-index:-1; pointer-events:none;"></div>
            <div class="quiz-card quiz-box tilt-card">

                <!-- TOP BAR -->
                <div class="quiz-topbar">
                    <div class="quiz-brand-inline">
                        <div class="brand-logo" style="width:40px; height:40px; font-size:1.1rem; border-radius:12px;">OQ</div>
                        <div>
                            <strong style="font-size:1.05rem; display:block; color:var(--text-main); line-height:1.2;">Online Quiz Portal</strong>
                            <span id="quizCategoryBadge" style="font-size:0.75rem; color:var(--text-secondary); font-weight:600;">Standard Evaluated Session</span>
                        </div>
                    </div>

                    <div style="display:flex; align-items:center; gap:12px;">
                        <span class="badge-pill blue" style="display:none;" id="assessmentBadge">Active</span>
                        <div class="quiz-timer-pill" id="timer">
                            15:00
                        </div>
                    </div>
                </div>

                <!-- PROGRESS BAR -->
                <div class="progress-meta-row">
                    <span class="quiz-progress-label">Evaluation Progress</span>
                    <span class="quiz-progress-status" id="progressStatus">Question 1</span>
                </div>
                <div class="progress-container">
                    <div id="progressBar"></div>
                </div>

                <!-- QUESTION NUMBER & TEXT (IDs preserved) -->
                <h3 id="questionNumber">Question 1 of 15</h3>

                <div class="question-card-inner question-box">
                    <p id="questionText">Loading question content...</p>
                </div>

                <!-- OPTIONS (IDs preserved) -->
                <div class="options options-list">
                    <label class="option-choice-label">
                        <input type="radio" name="answer" value="A">
                        <span id="optionA"></span>
                    </label>

                    <label class="option-choice-label">
                        <input type="radio" name="answer" value="B">
                        <span id="optionB"></span>
                    </label>

                    <label class="option-choice-label">
                        <input type="radio" name="answer" value="C">
                        <span id="optionC"></span>
                    </label>

                    <label class="option-choice-label">
                        <input type="radio" name="answer" value="D">
                        <span id="optionD"></span>
                    </label>
                </div>

                <!-- ACTION BUTTONS (IDs preserved) -->
                <div class="quiz-buttons quiz-actions-grid">
                    <button id="prevBtn" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        <span>Previous</span>
                    </button>

                    <button id="nextBtn" type="button">
                        <span>Next</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>

                    <button id="submitBtn" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        <span>Submit Quiz</span>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- TECH EFFECTS ENGINE -->
    <script src="js/tech-effects.js"></script>

    <!-- EXISTING QUIZ JAVASCRIPT -->
    <script src="js/api-config.js"></script>
    <script src="js/quiz.js"></script>

    <!-- PROGRESS SYNC & CATEGORY BADGE SCRIPT -->
    <script>
        const originalProgressBar = document.getElementById("progressBar");
        const originalQuestionNumber = document.getElementById("questionNumber");
        const progressStatus = document.getElementById("progressStatus");
        const quizCategoryBadge = document.getElementById("quizCategoryBadge");

        const catNames = {
            "1": "Java",
            "2": "DBMS",
            "3": "Operating System",
            "4": "Computer Networks",
            "5": "HTML",
            "6": "CSS",
            "7": "JavaScript",
            "8": "SQL",
            "9": "Aptitude",
            "10": "Logical Reasoning",
            "11": "Verbal Ability"
        };

        const activeCatId = localStorage.getItem("categoryId");
        if (quizCategoryBadge && activeCatId && catNames[activeCatId]) {
            quizCategoryBadge.innerText = catNames[activeCatId] + " • Evaluated Session";
        }

        function syncQuizProgress() {
            if (!originalQuestionNumber || !progressStatus) return;
            const text = originalQuestionNumber.innerText || "";
            if (text) {
                progressStatus.innerText = text;
            }
        }

        setInterval(syncQuizProgress, 300);
    </script>

</body>
</html>
