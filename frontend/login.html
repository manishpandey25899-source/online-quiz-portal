<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Quiz Portal - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="login-box">

            <!-- OQ BRAND -->
            <div
                class="brand"
                style="
                    justify-content:center;
                    margin-bottom:28px;
                "
            >

                <div class="brand-logo">
                    OQ
                </div>

            </div>


            <!-- PORTAL TITLE -->
            <h1
                style="
                    font-size:32px;
                    font-weight:800;
                    color:#24324a;
                    margin-bottom:8px;
                "
            >
                Online Quiz Portal
            </h1>


            <!-- LOGIN SUBTITLE -->
            <p
                style="
                    font-size:16px;
                    font-weight:600;
                    color:#667085;
                    margin-bottom:30px;
                "
            >
                Login to Continue
            </p>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- EMAIL -->
                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <!-- REGISTER LINK -->
            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </div>

        </div>

    </div>


    <!-- LOGIN JAVASCRIPT -->
    <script src="js/login.js"></script>

</body>
</html>
