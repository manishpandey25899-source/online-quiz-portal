<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Portal - Assessment Analytics</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .result-wrapper {
            width: 100%;
            max-width: 680px;
            margin: auto;
            position: relative;
            z-index: 2;
        }

        .result-card-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(101, 214, 176, 0.14), rgba(57, 120, 246, 0.1), transparent 70%);
            filter: blur(50px);
            z-index: -1;
            pointer-events: none;
        }

        .result-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .score-meter-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 1.5rem auto 2.25rem;
        }

        .score-circle-outer {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: linear-gradient(135deg, #F0F6FF 0%, #EEFAF4 100%);
            border: 8px solid #FFFFFF;
            box-shadow: 0 0 0 1px var(--border), 0 16px 36px rgba(57, 120, 246, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: scorePop 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes scorePop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .score-subtitle-tag {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        #score {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--primary-dark);
            line-height: 1.1;
        }

        /* 4 METRIC CARDS */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            text-align: left;
            transition: all var(--transition-fast);
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-subtle);
        }

        .metric-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .metric-card.correct-card {
            background: var(--success-soft);
            border-color: #CDEEDC;
        }

        .metric-card.correct-card .metric-value {
            color: var(--success);
        }

        .metric-card.wrong-card {
            background: var(--danger-soft);
            border-color: #F3CCCC;
        }

        .metric-card.wrong-card .metric-value {
            color: var(--danger);
        }

        /* ACTIONS */
        .result-actions-flex {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #answerKeyBtn {
            background: linear-gradient(135deg, var(--secondary) 0%, #5952D1 100%);
            box-shadow: 0 8px 24px rgba(107, 99, 232, 0.25);
        }

        #answerKeyBtn:hover {
            filter: brightness(1.06);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="result-container">
        <div class="result-wrapper">
            <div class="result-card-glow"></div>
            <div class="result-box tilt-card">

                <!-- BRAND HEADER -->
                <div class="result-header">
                    <div class="brand-logo" style="margin: 0 auto 1.25rem; width:52px; height:52px; font-size:1.35rem; border-radius:16px;">
                        OQ
                    </div>
                    <span class="badge-pill mint" style="margin-bottom: 12px;">Evaluation Complete</span>
                    <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">Assessment Result</h1>
                    <p>Here is your performance breakdown for the completed quiz session.</p>
                </div>

                <!-- SCORE DISPLAY (ID preserved) -->
                <div class="score-meter-box">
                    <div class="score-circle-outer score-display">
                        <span class="score-subtitle-tag score-label">Overall Score</span>
                        <span id="score">0%</span>
                    </div>
                </div>

                <!-- RESULT DETAILS (IDs preserved) -->
                <div class="analytics-grid result-details">
                    <!-- TOTAL QUESTIONS -->
                    <div class="metric-card result-stat">
                        <span class="metric-label result-stat-label">Total Questions</span>
                        <span class="metric-value result-stat-value" id="totalQuestions">0</span>
                    </div>

                    <!-- ATTEMPTED -->
                    <div class="metric-card result-stat">
                        <span class="metric-label result-stat-label">Attempted</span>
                        <span class="metric-value result-stat-value" id="attempted">0</span>
                    </div>

                    <!-- CORRECT -->
                    <div class="metric-card correct-card result-stat correct-stat">
                        <span class="metric-label result-stat-label">Correct Answers</span>
                        <span class="metric-value result-stat-value" id="correct">0</span>
                    </div>

                    <!-- WRONG -->
                    <div class="metric-card wrong-card result-stat wrong-stat">
                        <span class="metric-label result-stat-label">Wrong Answers</span>
                        <span class="metric-value result-stat-value" id="wrong">0</span>
                    </div>
                </div>

                <!-- ACTIONS (IDs preserved) -->
                <div class="result-actions-flex result-actions">
                    <button id="answerKeyBtn" class="login-btn" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                        <span>View Detailed Answer Key</span>
                    </button>

                    <button id="dashboardBtn" class="secondary-btn" type="button" style="width:100%; padding:14px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        <span>Back To Dashboard</span>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- TECH EFFECTS ENGINE -->
    <script src="js/tech-effects.js"></script>

    <!-- EXISTING RESULT JAVASCRIPT -->
    <script src="js/result.js"></script>

</body>
</html>
